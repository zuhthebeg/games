<style>
:root {

* { box-sizing: border-box; }
body { margin: 0; background: #e7cc90; color: var(--brown); font-family: system-ui, sans-serif; }
button { cursor: pointer; font: inherit; }
#game {

}
#hud {

}

#pad.active { bottom: auto; opacity: .9; }
#padKnob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; border-radius: 50%;

@media (pointer: coarse) { #pad { display: block; } }
#pad.active { display: block; }

canvas { width: 100%; height: 100%; display: block; touch-action: none; }
#team {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: #fff5d9dd;
  padding: 8px;
  border-radius: 12px;
  font-size: 12px;
}
#overlay {
  position: absolute;
  inset: 0;

  z-index: 5;
}
.panel {

  border: 5px solid var(--brown);

  max-height: 100%;
  overflow: auto;
  padding: 20px;
  text-align: center;

.btn.large { font-size: clamp(19px, 2vw, 26px); padding: 14px 24px; min-height: 58px; }
.eyebrow { font: bold 12px system-ui; letter-spacing: .18em; color: #8d613a; }

.title-actions { display: grid; gap: 12px; max-width: 310px; margin: 20px auto 0; }
.character-grid, .upgrade-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

.character-card, .upgrade-card {

  align-items: center;
  gap: 8px;
  padding: 12px 6px;

}

.upgrade-card { min-height: 166px; justify-content: center; font: 18px Jua; }

.shop-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.shop-card {
  min-width: 0;
  background: #fff9e6;
  border: 3px solid #8c8279;
  border-radius: 14px;
  padding: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.tier2 { border-color: #5b94d7 !important; box-shadow: 0 0 8px rgba(63,157,255,.55); }
.tier3 { border-color: #9a60c9 !important; box-shadow: 0 0 10px rgba(178,92,255,.65); }

.tier4::after { content: '★ MAX'; position: absolute; top: 2px; right: 4px; font: 10px Jua, sans-serif;

@keyframes tier4glow {

.trait { font-size: 12px; color: #744b2e; line-height: 1.25; min-height: 30px; }
.grade { font-size: 12px; font-weight: 700; }

.offer-actions .btn.cant { opacity: .45; }
.shop-toolbar { justify-content: space-between; font-size: 12px; }
.shop-divider { font: 17px Jua; border-top: 1px solid #c9aa78; padding-top: 5px; }
#shopSlots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.slot {

  border-radius: 8px;
  background: #fff;
  color: var(--brown);

  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;

.slot img { width: 30px; height: 30px; object-fit: contain; }
.slot.selected { background: #ffe38f; outline: 2px solid #8b5d23; }
.slot-actions .btn { padding: 4px 10px; min-height: 33px; }
.inventory { font-size: 11px; text-align: left; display: flex; align-items: center; gap: 8px; max-height: 46px; overflow: auto; }

.owned-item img { width: 18px; height: 18px; vertical-align: middle; }
.stat-panel { max-height: 54px; overflow: auto; grid-template-columns: repeat(4, 1fr); gap: 3px; font-size: 11px; text-align: left; }
.ready-btn { align-self: center; min-width: 170px; }

  .shop-art { width: 40px; height: 40px; }

  .shop-detail strong { font-size: 14px; }
  .shop-detail small { font-size: 9px; display: -webkit-box; -webkit-line-clamp: 2;

  .price { font-size: 11px; }
  .offer-actions { width: 100%; }
  .offer-actions .btn { min-height: 26px; font-size: 11px; }
  .shop-toolbar .btn, .slot-actions .btn { min-height: 29px; padding: 3px 7px; font-size: 11px; }
  .shop-divider { font-size: 13px; padding-top: 2px; }
  #shopSlots { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; }
  .slot { min-height: 46px; flex-direction: column; font-size: 8px; padding: 1px; }
  .slot img { width: 23px; height: 23px; }
  .slot span { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .inventory { max-height: 29px; overflow: auto; font-size: 9px; }
  .inventory .owned-item img { width: 14px; height: 14px; }
  .stat-panel { max-height: 64px; overflow: auto; grid-template-columns: repeat(3, 1fr); font-size: 9px; }
  .ready-btn { min-height: 33px; padding: 4px 12px; }
}
