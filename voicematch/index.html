let worker=null, workerState=null;
let workerReady=false, modelLoading=null, lastResult=null, analysisBusy=false;
// Generous wall-clock budgets include download/startup and inference respectively.
const MODEL_DEADLINE_MS=180000, ANALYZE_DEADLINE_MS=90000;
function failWorker(state,error){
  if(state.dead)return;
  state.dead=true;
  state.controller.abort();
  state.w.removeEventListener('error',state.onError);
  state.w.removeEventListener('messageerror',state.onMessageError);
  for(const reject of [...state.pending])reject(error);
  state.w.terminate();
  if(workerState===state){worker=null;workerState=null;workerReady=false;modelLoading=null;}
}
function createWorker(){
  const w=new Worker('analyzer.js?v=20261120cp');
  const state={w,dead:false,pending:new Set(),controller:new AbortController()};
  state.onError=ev=>{ev.preventDefault();failWorker(state,new Error('Worker error'));};
  state.onMessageError=()=>failWorker(state,new Error('Worker message error'));
  w.addEventListener('error',state.onError);
  w.addEventListener('messageerror',state.onMessageError);
  worker=w;workerState=state;
  return state;
}
function workerRequest(state,type,deadline,send,progress){
  if(!state||state.dead||workerState!==state)return Promise.reject(new Error('Worker unavailable'));
  return new Promise((resolve,reject)=>{
    let settled=false;
    const cleanup=()=>{clearTimeout(timer);state.w.removeEventListener('message',onMessage);state.pending.delete(fail);};
    const fail=error=>{if(settled)return;settled=true;cleanup();reject(error);};
    const onMessage=ev=>{
      if(settled||state.dead||workerState!==state)return;
      const m=ev.data;
      if(!m)return;
      if(m.type==='error'){failWorker(state,new Error(m.message||'Worker error'));return;}
      if(m.type==='progress'&&progress)progress(m);
      if(m.type===type){settled=true;cleanup();resolve(m);}
    };
    const timer=setTimeout(()=>failWorker(state,new Error('Worker timeout')),deadline);
    state.pending.add(fail);
    state.w.addEventListener('message',onMessage);
    // Register all listeners before any download or post; synchronous throws also poison this generation.
    Promise.resolve().then(()=>{if(!state.dead)return send();}).catch(error=>failWorker(state,error));
  });
}
function loadModel(){
  if(modelLoading)return modelLoading;
  let state;
  try{state=workerState||createWorker();}catch(error){return Promise.reject(error);}
  modelLoading=workerRequest(state,'ready',MODEL_DEADLINE_MS,async()=>{
    const options={signal:state.controller.signal};
    const [sj,mb]=await Promise.all([
      fetch('singers.json?v=20260820g1',options).then(r=>r.json()),
      (async()=>{
        const r=await fetch('ecapa_int8.onnx?v=20260719a',options);
        const total=+r.headers.get('Content-Length')||21664162;
        const reader=r.body.getReader();const chunks=[];let got=0;
        while(true){const{done,value}=await reader.read();if(state.dead)return;if(done)break;chunks.push(value);got+=value.length;
          $('ana-bar').style.width=Math.round(got/total*70)+'%';
          $('ana-s').textContent=t('dlLabel')+' '+Math.round(got/total*100)+'%';}
        const buf=new Uint8Array(got);let o=0;for(const c of chunks){buf.set(c,o);o+=c.length;}
        return buf.buffer;
      })()
    ]);
    if(state.dead||workerState!==state)return;
    window._singersCache=sj;updateIntroPoolBtn();
    state.w.postMessage({type:'init',singers:sj,model:mb,lang:LANG},[mb]);
  }).then(()=>{if(!state.dead&&workerState===state)workerReady=true;});
  return modelLoading;
}

// Release each resource independently: a platform cleanup failure must not skip the rest.
function cleanupCapture(){

  audioCtx=stream=proc=captureSource=recTimer=null;
  try{clearInterval(timer);}catch(e){}
  if(processor){
    try{processor.onaudioprocess=null;}catch(e){}
    try{processor.disconnect();}catch(e){}
  }
  try{source?.disconnect();}catch(e){}
  try{for(const track of media?.getTracks()||[]){try{track.stop();}catch(e){}}}catch(e){}
  try{const closing=ctx?.close();if(closing)Promise.resolve(closing).catch(()=>{});}catch(e){}
}

      ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      copied=document.execCommand('copy')===true;
    }catch(e2){}
    finally{ if(ta) ta.remove(); }

  try{dataLayer.push({event:'vm_inapp_copy'});}catch(e){}

async function stopRec(){
  cleanupCapture();
  const total=pcmChunks.reduce((a,c)=>a+c.length,0);
  if(total<recRate*2.5){try{dataLayer.push({event:'vm_too_short'});}catch(e){}$('err-t').innerHTML=t('errShort');resetErrBtn();show('s-err');return;}
  try{dataLayer.push({event:'vm_record_done'});}catch(e){}
  const pcm=new Float32Array(total);let o=0;for(const c of pcmChunks){pcm.set(c,o);o+=c.length;}
  show('s-ana');$('ana-t').textContent=t('judging');
  await analyzePcm(pcm,recRate,appendNext,recordingDay);
}
async function resampleTo16k(pcm,rate){
  if(rate===16000)return pcm;
  const len=Math.floor(pcm.length*16000/rate);
  const oc=new OfflineAudioContext(1,len,16000);
  const buf=oc.createBuffer(1,pcm.length,rate);
  buf.copyToChannel(pcm,0);
  const s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start();
  return (await oc.startRendering()).getChannelData(0);
}
async function analyzePcm(pcm,rate,append,sourceDay=dailyDayUTC()){
  if(analysisBusy)return; // One UI analysis owns the Worker/result at a time.
  analysisBusy=true;
  const day=append&&dailyAudioDay?dailyAudioDay:sourceDay;
  clearDailyResult();
  try{
    await loadModel();
    $('ana-bar').style.width='75%';$('ana-t').textContent=t('judging2');$('ana-s').textContent=t('analyzeSub');
    const state=workerState;
    const p16=await resampleTo16k(pcm,rate);
    const done=await workerRequest(state,'result',ANALYZE_DEADLINE_MS,()=>{
      const cp=new Float32Array(p16);
      state.w.postMessage({type:'analyze',pcm:cp,append:!!append},[cp.buffer]);
    },m=>{$('ana-bar').style.width=Math.min(95,75+m.done*6)+'%';});
    vmEv('analyze_done');
    // 무음이면 이번 테이크는 없던 것으로 둔다(누적 카운트도 올리지 않는다).
    if(done.error==='silent'){try{dataLayer.push({event:'vm_silent'});}catch(e){}$('err-t').innerHTML=t('errSilent');resetErrBtn();show('s-err');return;}
    takeCount=done.takes||1; appendNext=false;
    if(done.q)setDailyResult(done.q,day);
    if(done.pitch)lastPitch=done.pitch;
    // 듀엣 회신 루프용: 내 목소리 벡터+결과를 이 기기에 저장 —
    // 상대가 결과 링크를 보내오면 다시 부르지 않고 바로 케미를 보여준다
    if(done.q&&done.rank)saveDuetSelf(done,day);
    try{dataLayer.push({event:'vm_result_shown',takes:takeCount});}catch(e){}
    renderResult(done.rank,done.rankAll,done.rankJp,done.genres,done.report,done.rankCp);
    renderAddTake();
  }catch(e){
    $('err-t').innerHTML=t('errAnalyze')+'<br><span style="font-size:11px;opacity:.7">'+String(e.message||e).slice(0,120)+'</span>';resetErrBtn();show('s-err');
  }finally{analysisBusy=false;}
}

async function fetchBoard(url,day){
  const controller=new AbortController();let timer;
  try{
    const request=(async()=>{
      const response=await fetch(url,{method:'GET',credentials:'omit',signal:controller.signal});
      if(!response.ok)throw new Error('leaderboard HTTP');
      const data=await response.json();
      if(!data||data.success!==true||!Array.isArray(data.rankings)||
        (day&&data.day!==day)||data.rankings.some(row=>!row||typeof row.nickname!=='string'||
          !Number.isFinite(row.pct)||row.pct<0||row.pct>100))throw new Error('leaderboard response');
      return data;
    })();
    return await Promise.race([request,new Promise((_,reject)=>{
      timer=setTimeout(()=>{controller.abort();reject(new Error('leaderboard timeout'));},8000);
    })]);
  }finally{clearTimeout(timer);}
}

function dailyDayUTCOffset(off,day=dailyDayUTC()){const d=new Date(Date.UTC(+day.slice(0,4),+day.slice(4,6)-1,+day.slice(6,8)+off));return dailyDayUTC(d);}

/* ---- 듀엣 궁합 ----
   초대장 = URL 해시(#d=)에 담긴 상대 임베딩(int8 192B)+음역+이름. 서버 저장 없음 —
   목소리는 물론 벡터도 어디에도 업로드되지 않고, 케미 계산은 받은 쪽 기기에서 한다. */
let lastQ=null,lastPitch=null;
const DUET={in:null};
// l2norm 192차원 성분은 실측 ±0.3 안 — 이 스케일 int8 양자화의 cos 오차는 무시 수준
const EMB_SCALE=0.35;
const DUET_ANON={ko:'친구',en:'a friend',ja:'友達',es:'un amigo',tw:'朋友',id:'teman',pt:'um amigo'};
function b64uEnc(u8){let s='';for(const b of u8)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64uDec(str){const b=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function packEmb(q){const u=new Uint8Array(q.length);for(let i=0;i<q.length;i++){const v=Math.round(q[i]/EMB_SCALE*127)+128;u[i]=v<0?0:v>255?255:v;}return u;}
function unpackEmb(u){const a=new Array(u.length);let n=0;for(let i=0;i<u.length;i++){a[i]=(u[i]-128)/127*EMB_SCALE;n+=a[i]*a[i];}n=Math.sqrt(n)||1;return a.map(x=>x/n);}
function escHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
(function(){
  const m=location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/);
  if(!m)return;
  try{
    const p=JSON.parse(new TextDecoder().decode(b64uDec(m[1])));
    if(p&&p.v===1&&typeof p.e==='string'){
      const emb=unpackEmb(b64uDec(p.e));
      if(emb.length===192){p.emb=emb;DUET.in=p;}
    }
  }catch(e){}
  if(DUET.in){try{window.dataLayer=window.dataLayer||[];dataLayer.push({event:'vm_duet_opened'});}catch(e){}}
})();
function cosv(a,b){let c=0;for(let i=0;i<a.length;i++)c+=a[i]*b[i];return c;}
// 워커 topRank와 같은 tanh 상대 스케일 — "전체 가수 대비 두 사람이 얼마나 가까운가"
function relPct(c,dist){
  const mu=dist.reduce((a,b)=>a+b)/dist.length;
  const sd=Math.sqrt(dist.reduce((a,b)=>a+(b-mu)**2,0)/dist.length)||1;
  return Math.max(5,Math.min(99,Math.round(100*(0.55+0.45*Math.tanh((c-mu)/(2*sd))))));
}
// 워커 AXES와 같은 매크로 장르 분류(정규식 순서 중요)
const DUET_AXES=[['trot',/트로트|국악/],['jazz',/재즈|스탠더드/],['hiphop',/힙합/],['rnb',/R&B|소울/],
  ['rock',/록|그런지|펑크|밴드/],['dance',/댄스|케이팝/],['indie',/인디|포크|컨트리|어쿠스틱/],['ballad',/발라드|뮤지컬/]];
function topGenres(q,singers){
  const groups={};
  singers.forEach(s=>{
    let k='pop';for(const[key,re]of DUET_AXES)if(re.test(s.genre||'')){k=key;break;}
    (groups[k]=groups[k]||[]).push(cosv(q,s.emb));
  });
  const gs=[];
  for(const k in groups){
    const arr=groups[k].sort((a,b)=>b-a);if(arr.length<4)continue;
    gs.push({k,v:arr.slice(0,5).reduce((a,b)=>a+b)/Math.min(5,arr.length)});
  }
  gs.sort((a,b)=>b.v-a.v);
  return gs.map(g=>g.k);
}
function computeDuet(){
  const A=DUET.in,singers=window._singersCache;
  if(!A||!lastQ||!singers)return null;
  const tone=relPct(cosv(A.emb,lastQ),singers.map(s=>cosv(A.emb,s.emb)));
  let range=null;
  if(A.lo>0&&A.hi>A.lo&&lastPitch&&lastPitch.lo>0&&lastPitch.hi>lastPitch.lo){
    const st=f=>12*Math.log2(f/440);
    const a1=st(A.lo),a2=st(A.hi),b1=st(lastPitch.lo),b2=st(lastPitch.hi);
    let best=0;
    // 남녀 듀엣은 한 옥타브 차가 정상이라 ±12반음 시프트 중 최선의 겹침으로 잰다
    for(const off of[-12,0,12]){
      const o=Math.min(a2,b2+off)-Math.max(a1,b1+off);
      best=Math.max(best,Math.max(0,o)/(Math.min(a2-a1,b2-b1)||1));
    }
    range=Math.round(42+56*Math.min(1,best));
  }
  const gA=topGenres(A.emb,singers),gB=topGenres(lastQ,singers);
  let taste=null;
  if(gA.length&&gB.length)
    taste=gA[0]===gB[0]?94:(gB.slice(0,2).indexOf(gA[0])>=0||gA.slice(0,2).indexOf(gB[0])>=0)?80:63;
  const parts=[[tone,.5],[range,.25],[taste,.25]].filter(p=>p[0]!=null);
  const w=parts.reduce((a,p)=>a+p[1],0);
  const raw=parts.reduce((a,p)=>a+p[0]*p[1],0)/w;
  // 총점은 재미용 궁합 점수라 후하게 스케일(55~99). 축 바는 실측값 그대로 보여준다.
  // (실측: 랜덤 가수쌍 절반이 raw 50 미만 — 그대로 내보내면 "궁합 43%"가 공유를 죽인다)
  const total=Math.min(99,Math.round(55+0.45*raw));
  return {total,tone,range,taste,type:tone>=80?'twin':tone>=55?'harmony':'contrast'};
}
// 듀엣곡: 두 사람 모두에게 맞아야 한다 — 가수별 z점수의 min으로 "둘 다 적합"을 재고 상위 가수의 곡을 꼽는다
async function renderDuetSetlist(box){
  const A=DUET.in,singers=window._singersCache;
  if(!A||!lastQ||!singers)return;
  try{
    if(!catalogCache)catalogCache=await fetch(CATALOG_URL).then(r=>r.json());
    const pool0=singers.filter(s=>!s.intl&&(LANG==='ko'||s.gk));
    const pool=pool0.length?pool0:singers;
    const z=q=>{const cs=pool.map(s=>cosv(q,s.emb));const mu=cs.reduce((a,b)=>a+b)/cs.length;
      const sd=Math.sqrt(cs.reduce((a,b)=>a+(b-mu)**2,0)/cs.length)||1;return cs.map(c=>(c-mu)/sd);};
    const zA=z(A.emb),zB=z(lastQ);
    const ranked=pool.map((s,i)=>({s,f:Math.min(zA[i],zB[i])})).sort((a,b)=>b.f-a.f).slice(0,2);
    const bySlug={};catalogCache.artists.forEach(a=>bySlug[a.slug]=a);
    const picks=[];
    ranked.forEach((r,i)=>{
      const a=bySlug[r.s.slug];if(!a||!a.songs)return;
      a.songs.slice(0,i===0?2:1).forEach(sg=>{if(sg.vid&&sg.title)picks.push({artist:singerName(r.s,LANG),title:sg.title,vid:sg.vid});});
    });
    if(!picks.length)return;
    box.insertAdjacentHTML('beforeend',`<div class="sl-t">${t('duetSetlist')}</div>`+picks.slice(0,3).map(p=>
      `<a class="sl-row" href="https://youtu.be/${p.vid}" target="_blank" rel="noreferrer">`+
      `<span class="sl-play">▶</span><span class="sl-song">${p.title}</span><span class="sl-artist">${p.artist}</span></a>`).join(''));
  }catch(e){}
}

async function shareOrCopy(txt,btnId,current=()=>true){
  const button=$(btnId);

  if(navigator.share){try{await navigator.share({text:txt});return;}catch(e){}}
  if(!current())return;
  try{await navigator.clipboard.writeText(txt);}
  catch(e){
    if(!current())return;
    const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e2){}ta.remove();

/* 듀엣 공유 카드 (720x900) */
function rrPath(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function drawDuetCard(d){
  const c=$('card'),x=c.getContext('2d'),W=720,H=900;
  const nameA=DUET.in?(DUET.in.n||DUET_ANON[LANG]||'friend'):'';
  x.fillStyle='#1d1526';x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W*.5,140,10,W*.5,140,560);
  g.addColorStop(0,'rgba(240,110,170,.28)');g.addColorStop(1,'transparent');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(240,110,170,.55)';x.lineWidth=3;x.strokeRect(24,24,W-48,H-48);
  x.textAlign='center';
  x.fillStyle='#e8c66a';x.font='700 26px Pretendard';x.fillText(t('duetT'),W/2,96);
  const pair=`${nameA} × ${t('duetMe')}`;
  x.fillStyle='#f5eefb';x.font=(pair.length>12?"42px":"54px")+" 'Black Han Sans'";x.fillText(pair,W/2,178);
  x.fillStyle='#f06eaa';x.font="170px 'Black Han Sans'";x.fillText(d.total,W/2,382);
  x.font="54px 'Black Han Sans'";x.fillText(t('pts')||'%',W/2+152,382);
  const ty=t('duetType_'+d.type).split(' — ');
  x.fillStyle='#e8c66a';x.font="34px 'Black Han Sans'";x.fillText(ty[0],W/2,462);
  if(ty[1]){x.fillStyle='#cdbcdd';x.font='600 24px Pretendard';x.fillText(ty[1],W/2,504);}
  const rows=[[t('duetTone'),d.tone],[t('duetRange'),d.range],[t('duetTaste'),d.taste]].filter(r=>r[1]!=null);
  let y=584;
  for(const[lb,v]of rows){
    x.textAlign='left';x.fillStyle='#cdbcdd';x.font='700 24px Pretendard';x.fillText(lb,90,y);
    x.fillStyle='rgba(255,255,255,.12)';rrPath(x,300,y-20,290,22,11);x.fill();
    x.fillStyle='#f06eaa';rrPath(x,300,y-20,Math.max(22,290*v/100),22,11);x.fill();
    x.fillStyle='#b9f455';x.font='800 24px Pretendard';x.fillText(String(v),612,y);
    y+=62;
  }
  x.textAlign='center';
  x.fillStyle='#8f7fa3';x.font='500 22px Pretendard';x.fillText(t('cardFoot'),W/2,H-56);
  return c;
}

/* ---- 내 요청 추적: 처리되면 재방문 때 알려준다 (요청자 본인에게만, 1회) ---- */
const REQ_TRACK_KEY='vm_my_reqs';
const REQ_STATUS_API='https://relay.cocy.io/api/voicematch/request-status';
const reqSeenInPage=new Set();
let reqCheckBusy=false;
function loadReqs(){try{
  const a=JSON.parse(localStorage.getItem(REQ_TRACK_KEY)||'[]'),ids=new Set();
  return (Array.isArray(a)?a:[]).filter(x=>x&&Number.isSafeInteger(x.id)&&x.id>0
    &&typeof x.artist==='string'&&Number.isFinite(x.ts)&&!ids.has(x.id)&&ids.add(x.id)).slice(-20);
}catch(e){return [];}}
function saveReqs(a){try{localStorage.setItem(REQ_TRACK_KEY,JSON.stringify(a.slice(-20)));}catch(e){}}
function trackReq(id,artist){
  const a=loadReqs();
  if(a.some(x=>x.id===id))return;
  a.push({id:id,artist:artist,ts:Date.now()});
  saveReqs(a);
}
function showReqToast(name,status='done'){
  if(document.querySelector('.req-toast'))return false;
  const el=document.createElement('div');el.className='req-toast';
  const txt=document.createElement('div');txt.className='rt-t';txt.textContent=t(status==='failed'?'reqFailed':'reqDone')(name.slice(0,80));
  const cta=document.createElement('button');cta.className='rt-b';cta.textContent=t('reqDoneCta');
  const x=document.createElement('button');x.className='rt-x';x.textContent='×';x.setAttribute('aria-label','close');
  cta.onclick=()=>{el.remove();try{dataLayer.push({event:'vm_request_done_cta'});}catch(e){}show('s-intro');};
  x.onclick=()=>el.remove();
  el.setAttribute('role','status');
  el.appendChild(txt);if(status==='done')el.appendChild(cta);el.appendChild(x);
  document.body.appendChild(el);
  if(status==='done')vmEv('req_done_seen');
  setTimeout(()=>{if(el.isConnected)el.remove();checkMyReqs();},12000);
  return true;
}
async function checkMyReqs(){
  if(reqCheckBusy)return;
  reqCheckBusy=true;
  try{
    const mine=loadReqs();
    const fresh=mine.filter(x=>!reqSeenInPage.has(x.id)&&Date.now()-x.ts<30*24*3600*1000);
    if(fresh.length!==mine.length)saveReqs(fresh);
    if(!fresh.length)return;
    const r=await fetch(REQ_STATUS_API+'?ids='+fresh.map(x=>x.id).join(','));
    if(!r.ok)return;
    const j=await r.json();
    if(!Array.isArray(j?.requests))return;
    const rows=new Map();
    for(const row of j.requests)if(row&&Number.isSafeInteger(row.id)&&!rows.has(row.id))rows.set(row.id,row);
    const consumed=new Set();let shown=false;
    for(const own of fresh){
      const row=rows.get(own.id);
      if(!row)continue;
      if(row.status==='canceled')consumed.add(own.id);
      else if(!shown&&(row.status==='done'||row.status==='failed')&&showReqToast(own.artist,row.status)){
        shown=true;consumed.add(own.id);
      }
    }
    // An occupied single notice slot must not consume other terminal requests.
    for(const id of consumed)reqSeenInPage.add(id);
    if(consumed.size)saveReqs(loadReqs().filter(x=>!consumed.has(x.id)));
  }catch(e){}finally{reqCheckBusy=false;}
}

// 첫 화면 로딩(모델 fetch 등)과 경합하지 않게 조금 늦춰서 확인한다
(function(){
  const kick=()=>setTimeout(checkMyReqs,1500);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',kick);else kick();
})();

/* ---- 이미 수록된 가수인지 대조 ----
   요청의 63%가 이미 있는 가수였다(8/13~15 실측). 결과 상위권에 안 떴을 뿐인데
   "없구나" 하고 요청을 쓴다. 보내기 전에 잡아준다. */
let nameIndex=null;
// Rosé→rose 처럼 발음기호를 벗기고, 공백·점·괄호를 없앤 뒤 비교한다
function normName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\s._,'’\-()（）]/g,'');}
async function buildNameIndex(){
  if(nameIndex)return nameIndex;
  if(!catalogCache)catalogCache=await fetch(CATALOG_URL).then(r=>r.json());
  nameIndex={};
  catalogCache.artists.forEach(a=>{
    // 슬러그(영문)·한글명·EN/TW 표기 + catalog의 별칭(한자 등). 요청은 이 중 아무 표기로나 들어온다
    [a.slug,a.name,typeof EN_NAMES!=='undefined'&&EN_NAMES[a.slug],typeof TW_NAMES!=='undefined'&&TW_NAMES[a.slug]]
      .concat(a.al||[])
      .forEach(k=>{const n=normName(k);if(n)nameIndex[n]=a;});
  });
  return nameIndex;
}
async function findExisting(q){
  const n=normName(q);
  if(n.length<2)return null;
  try{return (await buildNameIndex())[n]||null;}catch(e){return null;}
}

async function openArtistList(focusSlug){
  if(typeof focusSlug!=='string')focusSlug='';

  if(btn&&btn.disabled)return;
  if(btn)btn.disabled=true;
  try{
    if(!catalogCache)catalogCache=await fetch(CATALOG_URL).then(r=>r.json());
  }catch(e){if(btn)btn.disabled=false;return;}
  if(btn)btn.disabled=false;
  const arts=catalogCache.artists.slice()
    .sort((a,b)=>singerName(a,LANG).localeCompare(singerName(b,LANG),LANG==='tw'?'zh-Hant':LANG));
  const m=document.createElement('div');m.id='al-modal';
  m.innerHTML=`<div id="al-box"><h3>${t('alT')}</h3>`
    +`<div id="al-sub">${t('alCount')(catalogCache.artist_count||arts.length,catalogCache.song_count||'')}</div>`
    +`<input id="al-q" placeholder="${t('alPh')}" autocomplete="off" maxlength="40">`
    +`<div id="al-list"></div><button id="al-close">${t('lb_close')}</button></div>`;
  document.body.appendChild(m);
  const list=m.querySelector('#al-list');
  const draw=q=>{
    const n=normName(q);
    // 부분일치로 찾는다. 여기선 오탐이 손해가 아니라 도움이다(요청 버튼과 달리 아무것도 막지 않는다)
    const hit=focusSlug&&q===focusSlug?arts.filter(a=>a.slug===focusSlug):n?arts.filter(a=>normName(singerName(a,LANG)).indexOf(n)>=0
      ||normName(a.slug).indexOf(n)>=0||normName(a.name).indexOf(n)>=0
      ||(a.al||[]).some(x=>normName(x).indexOf(n)>=0)):arts;
    list.innerHTML=hit.length
      ? hit.map(a=>`<div class="al-row"><b>${singerName(a,LANG)}</b><span>${genreLabel(a.genre,LANG)}</span></div>`).join('')
      : `<div class="al-none">${t('alNone')}</div>`;
  };
  const target=arts.find(a=>a.slug===focusSlug);

  m.querySelector('#al-q').value=initial;

}

  }catch(e){cardFailure();}
};
const X_TAGS={ko:'#목소리노래방',en:'#VoiceMatch #kpop',ja:'#声診断 #ボイスマッチ',es:'#VoiceMatch #kpop',tw:'#聲音分身',id:'#VoiceMatch #kpop',pt:'#VoiceMatch #kpop'};
/* 스레드 공유 — 유입의 대부분이 Threads(대만 핀 포스트 2.6K 좋아요)인데 X 버튼만 있었다.
   intent/post?text= 가 작성창을 문구+링크로 채워준다(2026-08-16 실제 확인, 링크 프리뷰도 붙음).
   이미지는 인텐트로 못 붙인다 — 이미지까지 올리려면 기본 공유(btn-share)를 써야 한다. */
$('btn-threads').onclick=()=>{
  if(!lastResult)return;
  vmEv('share');
  const top=lastResult[0];
  const url=vmShareUrl('threads',top);
  const txt=I18N[LANG].shareText(singerName(top,LANG),top.pct)+'\n'+(X_TAGS[LANG]||'')+'\n'+url;
  window.open('https://www.threads.com/intent/post?text='+encodeURIComponent(txt),'_blank','noopener');
  try{dataLayer.push({event:'vm_share_threads'});}catch(e){}
};
$('btn-x').onclick=()=>{
  if(!lastResult)return;
  vmEv('share');
  const top=lastResult[0];
  const url=vmShareUrl('x',top);
  const txt=I18N[LANG].shareText(singerName(top,LANG),top.pct)+'\n'+(X_TAGS[LANG]||'')+'\n'+url;
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(txt),'_blank','noopener');
};
$('btn-share').onclick=async()=>{
  vmEv('share');
  try{
    const b=await cardBlob();const f=new File([b],'voicematch.png',{type:'image/png'});
    const top=lastResult[0];
    const url=vmShareUrl('native',top);
    const data={files:[f],title:t('title'),text:I18N[LANG].shareText(singerName(top,LANG),top.pct)+' '+url};
    if(navigator.canShare&&navigator.canShare(data)){try{await navigator.share(data);}catch(e){if(e?.name!=='AbortError')$('btn-save').click();}}
    else $('btn-save').click();
  }catch(e){cardFailure();}
};

window.SharedWalletConfig={labels:{login:t('navLogin'),logout:t('navLogout')}};
try{if(typeof SharedWallet!=='undefined'&&SharedWallet.init&&!SharedWallet._initialized)SharedWallet.init();}catch(e){}
// 로그인 버튼 탭 카운트 — nav 로그인·결과/데일리 패널 로그인 등 모든 showLogin 호출을 한곳에서 잡는다
try{if(typeof SharedWallet!=='undefined'&&SharedWallet.showLogin&&!SharedWallet._vmEvLogin){
  SharedWallet._vmEvLogin=true;
  const _vmSL=SharedWallet.showLogin.bind(SharedWallet);
  SharedWallet.showLogin=function(){vmEv('login_tap');return _vmSL.apply(SharedWallet,arguments);};
}}catch(e){}
applyLang();drawLineup();
document.querySelectorAll('.lg').forEach(b=>{const old=b.onclick;b.onclick=()=>{LANG=b.dataset.l;localStorage.setItem('vm_lang',LANG);
window.SharedWalletConfig={labels:{login:t('navLogin'),logout:t('navLogout')}};
try{if(typeof SharedWallet!=='undefined'&&SharedWallet.init&&!SharedWallet._initialized)SharedWallet.init();else if(typeof SharedWallet!=='undefined'&&SharedWallet._updateUI)SharedWallet._updateUI();}catch(e){}
try{worker.postMessage({type:'lang',lang:LANG});}catch(e){}
applyLang();drawLineup();};});

/* 디버그: ?debug=1 → 파일 업로드 분석 */
if(new URLSearchParams(location.search).get('debug')){
  const inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.id='dbg-file';
  inp.style.cssText='position:fixed;left:10px;bottom:10px;z-index:99;color:#fff;font-size:11px';
  document.body.appendChild(inp);
  inp.onchange=async()=>{
    show('s-ana');
    const ab=await inp.files[0].arrayBuffer();
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await ac.decodeAudioData(ab);
    await analyzePcm(buf.getChannelData(0),buf.sampleRate);
  };
}
