<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>N3 dodge lag fixture</title></head>
<body style="margin:0;background:#101814"><div id="canvas"></div><div id="actions"></div><div id="joystick" hidden><i></i></div>
<script type="module">
import { Application } from '../vendor/pixi-8.22.0.min.mjs';
import { ArenaRenderer } from '../js/render/renderer.js';
import { InputLayer } from '../js/input.js';
import { connectBroadcast } from '../js/net/loopback.js';
import { CoopSession } from '../js/net/session.js';
import { emptyInput, spawnMonster } from '../js/sim/world.js';
import { ticks } from '../js/sim/core.js';
import { ABILITIES } from '../js/content/combat.js';
const q = new URLSearchParams(location.search), uid = q.get('uid');
const app = new Application(); await app.init({ width: 390, height: 640, preference: 'webgl', antialias: false, autoStart: false });
document.querySelector('#canvas').append(app.canvas);
const renderer = new ArenaRenderer(app), input = new InputLayer(app.canvas, document.querySelector('#actions'), () => {});
let session, pending = [], initialized = false, lastView, frames = 0, lastTime = performance.now();
const events = [], packets = [];
const start = roster => {
  session = new CoopSession({ uid, host: 'host', players: roster.players.map(p => p.user),
    profile: { level: 1, weapon: 'blade', mods: { maxHp: 2000 }, threats: { S2: 1 } }, config: { stageId: 'S2', threat: 1, seed: 11 },
    sendRt: p => { if (p.t === 'input' && packets.length < 500) packets.push(p); transport.sendRt(p); }, sendAction: a => transport.sendAction(a),

  onRt: (from, data) => session?.rt(from, data), onAction: a => session ? session.action(a) : pending.push(a),

  if (session?.isHost) session.update(dt, emptyInput());

  requestAnimationFrame(frame);

requestAnimationFrame(frame);

  get ready() { return initialized && session.phase === 'running'; },
  get dodgeNow() { const a = lastView?.entities.find(e => e.kind === 'monster')?.act; return a && a.phase !== 'recovery' && a.total - a.elapsed <= 2; },
  arm() {

    hp: self?.hp, maxHp: self?.maxHp, viewTick: lastView?.viewTick, rtt: session.rtt, frames,
    dodgePackets: packets.filter(p => p.dodgeViews?.length).slice(0,2), warnings: renderer.telegraphs.length }; },
};
</script></body></html>
