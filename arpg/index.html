        "./js/meta/stats.js": "./js/meta/stats.js?v=7b38876eef",
        "./js/render/renderer.js": "./js/render/renderer.js?v=c6e257be53",

    <link rel="stylesheet" href="css/game.css?v=8412a860bf">
  </head>
  <body>
    <main id="surface" aria-label="전투장"></main>
    <div id="vignette"></div>
    <section id="hud" hidden aria-label="전투 상태">
      <div class="vitals">
        <div class="bar hp"><i id="hp-fill"></i><span id="hp-text"></span></div>
        <div class="bar mp"><i id="mp-fill"></i><span id="mp-text"></span></div>
        <div class="bar load"><i id="load-fill"></i><span id="load-text"></span></div>
      </div>
      <div class="stage"><b id="stage-name"></b><span id="objective"></span></div>
      <div id="temp-loot"></div>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="joystick" hidden><i></i></div>
      <div id="actions" aria-label="전투 조작">
        <button data-input="potionEdge" class="small" id="potion">물약 Q<small></small></button>
        <button data-input="manaEdge" class="small" id="mana">마나 E<small></small></button>
        <button data-input="scrollEdge" class="small ring" id="scroll">귀환 R<small></small></button>
        <button data-input="skillEdge" class="ring" id="skill">스킬 K<small></small></button>
        <button data-input="dodgeEdge" id="dodge">회피 ⇧<small></small></button>
        <button data-input="attack" id="attack">공격 J<small>길게 누르기</small></button>
      </div>
      <div class="move-hint">왼쪽 드래그 · WASD 이동</div>
    </section>
    <section id="meta-screen" class="overlay" hidden aria-label="소환과 여관"></section>
    <section class="overlay" id="boot">
      <div class="story-panel"><h2>인장을 깨우는 중…</h2><p id="boot-error" role="alert"></p></div>
    </section>
    <section class="overlay" id="pause" hidden>
      <div class="story-panel"><h2>일시정지</h2><p>탭으로 돌아오면 전투가 재개됩니다.</p></div>
    </section>
    <script type="module" src="js/main.js?v=143e9c8231"></script>
  </body>
</html>
