<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";

const $ = id => document.getElementById(id);
let DATA = null, ANIMALS = [], AXIS_W = {};
const animImgs = {};

// i18n — 동물 이름/설명은 animals.json(한국어 정본)을 사전으로 덮어쓴다.
const T = (k, p) => AF_I18N.t(k, p);
const NAME = a => AF_I18N.animal(a.id, { name: a.name, desc: a.desc }).name;
const DESC = a => AF_I18N.animal(a.id, { name: a.name, desc: a.desc }).desc;

function applyLang() {
  document.documentElement.lang = AF_I18N.htmlLang();
  document.title = T('metaTitle');
  // 정적 meta는 한국어로 박혀 있다. 언어를 바꾸면 공유 카드·검색 스니펫도 따라가야 한다.
  const setMeta = (sel, v) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', v); };
  $('pbT').textContent = T('privacyT');
  $('pbS').textContent = T('privacyS');
  setMeta('meta[name="description"]', T('metaDesc'));
  setMeta('meta[property="og:title"]', T('metaTitle'));
  setMeta('meta[property="og:description"]', T('metaDesc'));
  setMeta('meta[name="twitter:title"]', T('metaTitle'));
  setMeta('meta[name="twitter:description"]', T('metaDesc'));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T(el.dataset.i18n);
    if (el.dataset.i18n === 'foot' || v.includes('<br>')) el.innerHTML = v; else el.textContent = v;
  });
  const L = AF_I18N.lang();   // '다음 언어'를 띄우면 지금 언어로 오해한다 — 현재 언어를 보여준다
  $('langBtn').textContent = '🌐 ' + (L === 'tw' ? '繁中' : L.toUpperCase());
  $('langBtn').title = AF_I18N.next().toUpperCase();
  if (mirroring) $('mirror').textContent = T('mirrorStop');
  if (AX) { renderAxes(); renderResult(); }
  if (LAST_DIST) renderDist(LAST_DIST);
}
$('langBtn').onclick = () => { AF_I18N.cycle(); applyLang(); };

window.addEventListener('DOMContentLoaded', () => {
  try { if (typeof SharedWallet !== 'undefined' && SharedWallet.init && !SharedWallet._initialized) SharedWallet.init(); } catch (e) {}
});

const cv = $('cv'), ctx = cv.getContext('2d');
function fit(){ const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio||1, 2);
  const w = Math.round(r.width*d), h = Math.round(r.height*d);
  if (cv.width === w && cv.height === h) return false;
  cv.width = w; cv.height = h;         // 크기 대입은 캔버스를 지운다
  return true;
}
// 폰 회전·주소창 접힘도 resize다. 다시 그리지 않으면 결과 그림이 그대로 날아간다.
addEventListener('resize', () => { if (fit() && !mirroring) redraw(); });
fit();
function redraw(){
  if (!ranked) return;
  const aimg = animImgs[ranked[0].a.id];
  ctx.clearRect(0,0,cv.width,cv.height);
  if (aimg && aimg.complete) ctx.drawImage(aimg, 0, 0, cv.width, cv.height);
}

let srcImg = null, LM = null, LM_DRAW = null, LM3 = null, FRONT3 = null, AX = null, ranked = null;

// ---- 데이터 ----
fetch('animals.json?v=10').then(r => r.json()).then(d => {
  // 아트가 아직 없는 종은 후보에서 뺀다. 넣어두면 1등으로 뽑혔을 때 깨진 이미지가 보인다.
  DATA = d; ANIMALS = d.animals.filter(a => a.art !== false);
  AXIS_W = d.axisWeight;
  ANIMALS.forEach(a => { const im = new Image(); im.src = `img/${a.id}.webp`; animImgs[a.id] = im; });
});

function celebsOf(id, sex) {

/* 팬트랙 링크. export 스크립트가 '실제로 존재하는 페이지'만 c/<slug>/ 로 넣고,

   개인/그룹 페이지는 언어가 경로 뒤(/c/ive/en/), 검색은 앞(/fantrack/en/?q=)에 붙는다. */
function fantrackUrl(link) {

/* 이름 표기는 언어를 따라간다. 팬트랙에 번체 한자가 없는 인물은 한글이 아니라 영문으로 떨어뜨린다

function celebName(x) {
  const L = AF_I18N.lang();
  if (L === 'ko') return { n: x.name, g: x.group };
  if (L === 'tw') return { n: x.tw || x.en || x.name, g: x.group_tw || x.group_en || x.group };
  return { n: x.en || x.name, g: x.group_en || x.group };     // en · ja

function celebChips(list, n) {

// ---- 8축 실측 ----
const P = { eyeL_out:33, eyeL_in:133, eyeL_up:159, eyeL_dn:145,
  eyeR_in:362, eyeR_out:263, eyeR_up:386, eyeR_dn:374,
  cheekL:234, cheekR:454, chin:152, forehead:10,
  noseL:129, noseR:358, noseTip:1, lipUp:13, lipDn:14, lipL:61, lipR:291, jawL:172, jawR:397 };
const d2 = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const clamp01 = v => Math.max(0, Math.min(1, v));

/* MediaPipe 좌표는 x=가로폭 기준, y=세로높이 기준으로 각각 0~1이다.
   즉 정사각형이 아닌 사진에서는 x와 y의 '1'이 서로 다른 길이라서
   그대로 거리를 재면 세로 사진은 얼굴이 납작하게, 가로 사진은 길쭉하게 측정된다.
   실제로 같은 얼굴이 3:4에서는 "정면 아님"으로 거부되고 4:3에서는 축이 1.00에 붙었다.
   → y에 (높이/너비)를 곱해 가로폭 기준 등방 좌표로 바꾼 뒤에 잰다. */
function isoLandmarks(lm, srcW, srcH) {
  const a = (srcH && srcW) ? srcH / srcW : 1;
  return lm.map(p => ({ x: p.x, y: p.y * a, z: p.z }));
}
const mediaSize = el => [el.naturalWidth || el.videoWidth || el.width,
                         el.naturalHeight || el.videoHeight || el.height];
/* 구간은 감이 아니라 실측이다. 얼굴 표본 12개(둥근·긴·각진·통통·노년 등)를 재서
   p10~p90에 여유를 준 값. 감으로 찍었을 때 lipThick를 [0.100,0.400]으로 잡았는데
   실제 분포는 0.003~0.101이라 전 사용자가 0으로 눌렸다. 표본 재측정 없이 손대지 말 것.
   보정 도구: ops/verify/af-calib.cjs */
const RANGE = { eyeSize:[0.035,0.115], eyeSlant:[-0.006,0.050], eyeGap:[0.216,0.304],
  faceLength:[1.000,1.360], jawSharp:[0.132,0.302], cheek:[1.143,1.425],
  noseWidth:[0.227,0.343], lipThick:[0.000,0.349] };
// 표본 81장 실측 union. noseWidth를 [0.250,0.318]로 좁게 잡았더니 실제 분포(0.244~0.320)가
// 구간 밖으로 삐져나가 대부분의 얼굴이 1.00에 붙었다. lipThick도 상한이 3배 낮았다.

function computeAxes(lm) {
  const g = i => lm[i];
  const faceW = d2(g(P.cheekL), g(P.cheekR)), faceH = d2(g(P.forehead), g(P.chin));
  const eyeH = (d2(g(P.eyeL_up),g(P.eyeL_dn)) + d2(g(P.eyeR_up),g(P.eyeR_dn)))/2;
  const slant = ((g(P.eyeL_in).y - g(P.eyeL_out).y) + (g(P.eyeR_in).y - g(P.eyeR_out).y))/2;
  const jawW = d2(g(P.jawL), g(P.jawR));
  const raw = {
    eyeSize: eyeH/faceW, eyeSlant: slant/faceW, eyeGap: d2(g(P.eyeL_in),g(P.eyeR_in))/faceW,
    faceLength: faceH/faceW, jawSharp: 1 - jawW/faceW, cheek: faceW/jawW,
    noseWidth: d2(g(P.noseL),g(P.noseR))/faceW,
    lipThick: d2(g(P.lipUp),g(P.lipDn))/d2(g(P.lipL),g(P.lipR)),
  };
  window.__raw = raw;              // RANGE 보정용 — 상수를 감으로 찍지 않기 위해 실측값을 노출한다
  const out = {};
  for (const k in raw) { const [lo,hi] = RANGE[k]; out[k] = clamp01((raw[k]-lo)/(hi-lo)); }
  window.__ax = out;               // 동물 축 값 튜닝용(af-tune.cjs)
  return out;
}


/* ---- 성별 추정 ----
   추가 모델을 받지 않는다. 이미 재고 있는 8축만으로 로지스틱 회귀를 돌렸다.
   학습: 성별 라벨이 있는 실제 인물 사진 182장(ops/verify/af-gender-collect.cjs).
   5-fold 정확도 79.2% (전부 여자로 찍는 기준선 70.3%) — 맞히는 편이지만 확신할 수준은 아니다.
   그래서 결과를 뒤집지 않고, 확신도에 비례해 후보를 밀어주기만 한다. */
const G_MU = [0.071636,0.024884,0.256844,1.193856,0.213485,1.272564,0.283982,0.068112];
const G_SD = [0.015069,0.011670,0.014354,0.082604,0.023359,0.038136,0.016277,0.094986];
const G_W  = [0.6940,0.8173,0.8509,-0.9930,-0.1783,-0.2305,-0.2704,1.0472];
const G_B  = 1.2015;
const G_KEYS = ['eyeSize','eyeSlant','eyeGap','faceLength','jawSharp','cheek','noseWidth','lipThick'];

function femProb(raw) {
  if (!raw) return 0.5;
  let z = G_B;
  for (let i = 0; i < G_KEYS.length; i++) z += G_W[i] * ((raw[G_KEYS[i]] - G_MU[i]) / G_SD[i]);
  return 1 / (1 + Math.exp(-z));
}
let SEX_MODE = 'auto';        // auto | f | m | off — 사용자가 결과에서 바꿀 수 있다
let PFEM = 0.5;
function femSignal() {        // -1(남) ~ +1(여). off면 0으로 눌러 가중치를 끈다
  if (SEX_MODE === 'f') return 1;
  if (SEX_MODE === 'm') return -1;
  if (SEX_MODE === 'off') return 0;
  return 2*PFEM - 1;
}

// 모드 토글은 뺐다(웃긴 모드가 늘 같은 답을 내서 재미도 없고 쓸모도 없었다).
// 다만 못생김 라인이 아무에게나 1등으로 뜨면 기분 상하니 뒤로 미는 가중은 남긴다.
/* funny(못생김·기괴 라인)는 2.2로 강하게 뒤로 민다. 균형 계수로 모든 종을 골고루 띄우려 했더니
   블롭피시·벌거숭이두더지쥐 같은 종이 멀쩡한 얼굴에 붙어서 "왜 이게 나오는지 맥락이 없다"는 소리를 들었다.
   별코두더지는 아예 후보에서 뺐다. myth(사신기)도 흔하면 '전설'이 아니라 기본값이 된다. */
const TIER_MUL = { cute:1, cool:1, funny:2.2, myth:1.45 };

/* 사람 얼굴은 8차원 공간의 아주 좁은 영역에 몰려 있다(다 사람이니까).
   반면 동물 축은 0~1 전체에 퍼져 있어서, 절대좌표로 거리를 재면
   '사람 무리 중심에 제일 가까운 동물'이 거의 모든 사람에게 1등이 된다(실측: 별코두더지 7/12).
   그래서 양쪽을 각자의 분포로 표준화해서 비교한다 —
   "사람 중에서 유난히 얼굴이 긴 편" ↔ "동물 중에서 유난히 얼굴이 긴 종". */
const HUMAN_RAW = { eyeSize:[0.0721,0.0182], eyeSlant:[0.0202,0.0107], eyeGap:[0.2563,0.0140],
  faceLength:[1.1747,0.0842], jawSharp:[0.2104,0.0319], cheek:[1.2686,0.0516],
  noseWidth:[0.2846,0.0149], lipThick:[0.0188,0.0296] };   // 표본 12개 실측 (af-calib.cjs)
let ANIMAL_STATS = null;
function animalStats() {
  if (ANIMAL_STATS) return ANIMAL_STATS;
  ANIMAL_STATS = {};
  for (const k in AXIS_W) {
    const v = ANIMALS.map(a => a.axes[k]);
    const m = v.reduce((x,y)=>x+y,0)/v.length;
    const sd = Math.sqrt(v.reduce((x,y)=>x+(y-m)**2,0)/v.length) || 1;
    ANIMAL_STATS[k] = [m, sd];
  }
  return ANIMAL_STATS;
}

function match(ax) {
  const mul = TIER_MUL, raw = window.__raw, AS = animalStats();
  const rawD = {}; window.__dist = rawD;      // 종별 정규화 계수 산출용(ops/verify/af-norm-collect.cjs)
  const z = {};
  for (const k in AXIS_W) {
    const [m, sd] = HUMAN_RAW[k];
    // raw가 있으면 실측 원시비율로, 없으면 정규화값으로 폴백
    z[k] = raw ? (raw[k]-m)/(sd||1) : (ax[k]-0.5)*3;
    z[k] = Math.max(-2.5, Math.min(2.5, z[k]));
  }
  const scored = ANIMALS.map(a => {
    /* 유클리드 거리로 재면 '사람 평균에 제일 가까운 종'이 거의 전부를 먹는다.
       실측: 28종 중 12종만 1위가 됐고 호랑이 혼자 48%, 여우·사슴은 한 번도 안 나왔다.
       그래서 '거리'가 아니라 '패턴'을 본다 — 어느 축이 튀는지의 방향(코사인)이 얼마나 닮았나.
       바꾼 뒤 26종이 1위로 나온다. */
    let dotv = 0, n1 = 0, n2 = 0;
    for (const k in AXIS_W) {
      const [am, asd] = AS[k];
      const az = Math.max(-2.5, Math.min(2.5, (a.axes[k]-am)/asd));
      const w = AXIS_W[k]||1;
      dotv += w*z[k]*az; n1 += w*z[k]*z[k]; n2 += w*az*az;
    }
    const s = 1 - dotv/((Math.sqrt(n1)*Math.sqrt(n2)) || 1e-9);
    // 여자로 보이면 토끼·사슴 쪽을, 남자로 보이면 늑대·공룡 쪽을 앞으로 당긴다.
    // 세기는 실측으로 정했다. ±14%에서는 결과가 전혀 안 움직였고(1위 유형 fem 평균 -0.07),
    // ±32%에서 비로소 여자/남자 사진의 결과가 갈렸다. 확신도가 낮으면 femSignal이 0에 가까워
    // 자동으로 약해진다 — 애매한 얼굴은 원래대로 기하만 본다.
    const gb = 1 - 0.32 * (a.fem || 0) * femSignal();
    const raw = s;
    rawD[a.id] = raw;
    /* norm = 그 종이 사람 얼굴 표본(182장)에서 받는 평균 거리.
       이걸로 나누지 않으면 '사람 평균에 가까운 종'이 전부 1등을 먹는다.
       실측: 정규화 전에는 28종 중 13종만 1위가 됐고 여우·사슴·구미호는 한 번도 못 나왔다. */
    return { a, dist: raw / (a.norm || 1) * (mul[a.tier]||1) * gb };
  }).sort((x,y) => x.dist - y.dist);
  const top = scored[0].dist;
  // 절대거리를 그대로 쓰면 전부 40%대로 나와서 재미가 없다 → 1위 기준 상대 스케일
  // 코사인으로 바꾸면서 값 범위가 달라졌다. 표본 182장의 2위 갭 중앙값(0.0248)으로 다시 잡은 계수다.
  return scored.map((s,i) => ({ ...s, pct: Math.max(41, Math.round(95 - (s.dist-top)*300 - i*1.2)) }));
}

function whyText(ax, animal) {
  return Object.keys(ax)
    .map(k => ({ k, gap: Math.abs(ax[k]-animal.axes[k])*(AXIS_W[k]||1) }))
    .sort((a,b) => a.gap-b.gap).slice(0,2)
    .map(d => AF_I18N.axis(d.k) + ' ' +
      (ax[d.k] > .55 ? T('big') : ax[d.k] < .45 ? T('small') : T('mid')))
    .join(' · ');
}

$('pick').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  stopMirror();
  const im = new Image();
  im.onload = () => { srcImg = im; drawBase(); detect(); };

// 카메라는 미리보기를 띄우고 사용자가 직접 셔터를 누르게 한다.
// (예전엔 버튼 누르면 0.7초 뒤 몰래 한 장 찍어서, 언제 찍히는지 알 수 없어 쓰기 불편했다)
async function openCam() {
  const v = $('vid');
  if (!v.srcObject) {
    try {
      v.srcObject = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:'user', width:{ ideal:1280 } } });
      await v.play();
    } catch (e) { $('ph').textContent = T('errCam', { msg: e.message }); return false; }
  }
  v.style.display = ''; $('ph').style.display = 'none';
  $('shotRow').style.display = '';
  // 결과 동물이 그려진 캔버스가 video 위를 덮고 있으면 미리보기가 안 보인다.
  // (판독 한 번 하고 카메라를 다시 열면 재현되던 버그)
  ctx.clearRect(0, 0, cv.width, cv.height);
  return true;
}
function closeCam(stopStream) {
  const v = $('vid');
  v.style.display = 'none';
  $('shotRow').style.display = 'none';
  if (stopStream && v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
}
$('cam').onclick = () => { stopMirror(); openCam(); };
$('camOff').onclick = () => { closeCam(true); if (ranked) redraw(); else $('ph').style.display = ''; };
$('shot').onclick = () => {
  const v = $('vid');
  if (!v.videoWidth) return;
  // 미리보기(object-fit:contain)와 완전히 같은 프레임을 저장한다.
  // 예전엔 미리보기는 cover로 잘라 보여주고 저장은 원본 전체라, 보이는 것과 찍히는 게 달랐다.
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const x = c.getContext('2d');
  x.translate(c.width, 0); x.scale(-1, 1);        // 미리보기와 같은 좌우 반전으로 저장
  x.drawImage(v, 0, 0);
  const im = new Image();
  im.onload = () => { srcImg = im; closeCam(false); drawBase(); detect(); };
  im.src = c.toDataURL('image/jpeg', 0.92);
};

function drawBase(alpha = 1) {
  ctx.clearRect(0,0,cv.width,cv.height);
  if (!srcImg) return null;
  $('ph').style.display = 'none';
  const s = Math.max(cv.width/srcImg.width, cv.height/srcImg.height);
  const w = srcImg.width*s, h = srcImg.height*s;
  ctx.globalAlpha = alpha;
  ctx.drawImage(srcImg, (cv.width-w)/2, (cv.height-h)/2, w, h);
  ctx.globalAlpha = 1;
  return { x:(cv.width-w)/2, y:(cv.height-h)/2, w, h };
}
let baseBox = null;

// 검출됐다고 다 사람 얼굴이 아니다 — 기하가 말이 되는지 다시 본다.
// 억지로 맞춘 결과를 그럴듯하게 내놓는 게 신뢰에 제일 치명적이라 거부하는 쪽을 택했다.
function faceQuality(lm) {
  const g = i => lm[i];
  const faceW = d2(g(P.cheekL), g(P.cheekR)), faceH = d2(g(P.forehead), g(P.chin));
  if (faceW < 0.06) return { ok:false, reason:'errSmall' };
  const r = faceH/faceW;
  if (r < 0.9 || r > 2.2) return { ok:false, reason:'errFront' };
  const eyeY = (g(P.eyeL_up).y + g(P.eyeR_up).y)/2;
  if (!(eyeY < g(P.noseTip).y && g(P.noseTip).y < g(P.lipDn).y))
    return { ok:false, reason:'errStruct' };
  const eL = d2(g(P.eyeL_up),g(P.eyeL_dn)), eR = d2(g(P.eyeR_up),g(P.eyeR_dn));
  if (Math.abs(eL-eR)/Math.max(eL,eR,1e-6) > 0.6)
    return { ok:false, reason:'errTurned' };
  return { ok:true };
}

// reason은 i18n 키다. 문자열을 그대로 넘기면 언어 전환에서 한국어가 남는다.
function fail(reason) {
  LM = null; AX = null; ranked = null;
  $('mirror').disabled = true; $('rec').disabled = true;
  baseBox = drawBase(0.3);
  $('axCard').style.display = 'none';
  $('resultCard').style.display = '';
  $('result').innerHTML = `<div class="err">✕ ${T(reason)}</div>
    <div class="hint">${T('errHint')}</div>`;
}

function detect() {
  if (!landmarker || !srcImg || !ANIMALS.length) return;
  if (runMode !== 'IMAGE') { landmarker.setOptions({ runningMode:'IMAGE' }); runMode = 'IMAGE'; }
  const r = landmarker.detect(srcImg);
  if (!r.faceLandmarks?.length) return fail('errNoFace');
  const [iw, ih] = mediaSize(srcImg);
  const lm = isoLandmarks(r.faceLandmarks[0], iw, ih);   // 사진 비율 보정 후 측정
  const q = faceQuality(lm);
  if (!q.ok) return fail(q.reason);
  LM = lm;
  LM_DRAW = r.faceLandmarks[0];   // 화면에 점 찍을 땐 보정 안 한 원좌표를 써야 사진과 맞는다
  window.__lm = lm.map(q => [+q.x.toFixed(5), +q.y.toFixed(5)]);   // 형상 벡터 실험용 덤프
  // 자세 정규화 실험용: 3D 좌표 + MediaPipe가 주는 머리 자세 행렬.
  // 같은 사람 사진끼리도 안 뭉치는 원인이 각도라서, 이걸로 정면화한 뒤 다시 잰다.
  LM3 = r.faceLandmarks[0].map(q => [q.x, q.y, q.z]);
  FRONT3 = frontalize(LM3);
  window.__front = FRONT3;   // 정면화 검증용(ops/verify/af-cloudcheck.cjs)
  window.__lm3 = LM3;
  window.__mat = r.facialTransformationMatrixes?.[0]?.data || null;
  AX = computeAxes(LM);
  PFEM = femProb(window.__raw);
  window.__pfem = PFEM;
  baseBox = drawBase();
  ranked = match(AX);
  renderAxes(); renderResult();
  $('mirror').disabled = false;
  reveal(true);
  submitDist(ranked[0].a.id);   // 분포 집계(동물 종류만) — 사진은 나가지 않는다
}

/* 결과 연출: 사진 위에 468개 점을 훑고(스캔) → 동물로 크로스페이드.
   점을 보여주는 건 장식이 아니라 "정말 얼굴을 쟀다"는 근거라서, 결과 신뢰에 직결된다. */
const SAMPLE = []; for (let i = 0; i < 468; i += 3) SAMPLE.push(i);
function toPx(p, box) { return { x: box.x + p.x*box.w, y: box.y + p.y*box.h }; }
// 사진 안에서 얼굴이 차지한 실제 영역(px) — 점이 찍힌 자리 그대로다
function faceBoxPx(box) {
  let a = 1, b = 0, c = 1, d = 0;
  for (const q of LM_DRAW) { if (q.x<a) a=q.x; if (q.x>b) b=q.x; if (q.y<c) c=q.y; if (q.y>d) d=q.y; }
  return { cx: box.x + (a+b)/2*box.w, cy: box.y + (c+d)/2*box.h,
           r: Math.max((b-a)*box.w, (d-c)*box.h)/2 };
}

/* 후보를 한 바퀴 돌리는 룰렛 목록. 마지막 칸은 반드시 정답이라
   감속이 끝나는 순간과 결과가 정확히 맞는다(랜덤으로 두면 마지막에 다른 게 걸린다). */
function spinReel(winnerId, n) {
  const pool = ANIMALS.filter(a => a.id !== winnerId && animImgs[a.id]?.complete);
  const reel = [];
  for (let i = 0; i < n; i++) reel.push(pool[Math.floor(Math.random()*pool.length)] || null);
  reel.push(ANIMALS.find(a => a.id === winnerId));
  return reel.filter(Boolean);
}


/* 얼굴 윤곽선(face oval) 랜드마크. 이 점들만 굵게 찍으면 얼굴이 긴지 둥근지가 눈에 들어온다.
   468점을 전부 같은 크기로 찍으면 실루엣이 뭉개져서 어떤 얼굴이든 비슷한 원형 덩어리가 된다. */
const OVAL = new Set([10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,
  148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109]);

/* 468점을 3D로 찍는다. 연출(캔버스)과 공유 카드가 같은 함수를 쓴다 — 두 벌이면 반드시 어긋난다.

   먼저 '정면화'를 한다. 사진 속 얼굴이 이미 3/4로 돌아가 있으면 거기에 회전을 더 얹는 꼴이라
   스윙 내내 준-측면이 되고, 점이 그냥 흩뿌린 것처럼 보인다(첫 버전이 정확히 이랬다).
   눈 양끝과 이마-턱으로 얼굴 고유축을 만들어 그 좌표계로 옮긴 뒤에 돌린다. */
function frontalize(lm3) {
  const g = i => lm3[i];
  const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const norm = a => { const n = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/n, a[1]/n, a[2]/n]; };
  const ex = norm(sub(g(263), g(33)));           // 왼눈 바깥 → 오른눈 바깥
  const down = norm(sub(g(152), g(10)));         // 이마 → 턱
  const ez = norm(cross(ex, down));              // 얼굴 정면 법선
  const ey = cross(ez, ex);
  const o = g(1);                                // 코끝을 원점으로
  return lm3.map(q => { const v = sub(q, o); return [dot(v,ex), dot(v,ey), dot(v,ez)]; });
}

const CLOUD_COLOR = { cute:'#2f8f5e', cool:'#25706c', funny:'#c07a1e', myth:'#6b4fbb' };
function cloudColor() { return (ranked && CLOUD_COLOR[ranked[0].a.tier]) || '#25706c'; }

function drawCloud(x, front, cx, cy, R, yaw, color, dot) {
  if (!front || !front.length) return;
  const cos = Math.cos(yaw), sin = Math.sin(yaw);
  // 회전 뒤에 다시 중심·크기를 잡는다. 회전 전 기준으로 잡으면 각도가 커질수록 옆으로 밀린다.
  const pts = new Array(front.length);
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (let i = 0; i < front.length; i++) {
    const q = front[i];
    const rx = q[0]*cos + q[2]*sin;
    const rz = -q[0]*sin + q[2]*cos;
    const persp = 1 / (1 + rz*0.8);              // 원근은 약하게 — 세게 주면 실루엣이 뭉갠다
    const px = rx*persp, py = q[1]*persp;
    pts[i] = [px, py, persp];
    if (px<minX) minX=px; if (px>maxX) maxX=px;
    if (py<minY) minY=py; if (py>maxY) maxY=py;
  }
  const mx = (minX+maxX)/2, my = (minY+maxY)/2;
  /* 스케일은 '눈 사이 거리'로 고정한다. 바운딩박스를 원에 꽉 맞추면 얼굴 길이 차이가
     정규화로 지워져서 누가 넣어도 같은 넙죽한 얼굴이 된다 — 실제로 그런 지적을 받았다.
     메시 자체는 사람마다 다르다(윤곽점 편차가 눈 거리의 7~11%). 눈 거리를 단위로 쓰면
     긴 얼굴은 길게, 넓은 얼굴은 넓게 — 실측 비율 그대로 그려진다. */
  const eyeD = Math.hypot(pts[33][0]-pts[263][0], pts[33][1]-pts[263][1]) || 1;
  const k = R / (eyeD * 1.25);
  x.fillStyle = color;
  for (let i = 0; i < pts.length; i++) {         // 솎지 않는다. 솎으면 눈·입술 링이 끊긴다
    const q = pts[i], edge = OVAL.has(i);
    x.globalAlpha = (edge ? 1 : 0.55) * Math.max(.35, Math.min(1, q[2]));  // 깊이는 농도로만
    x.beginPath();
    x.arc(cx + (q[0]-mx)*k, cy + (q[1]-my)*k, edge ? dot*1.7 : dot*0.8, 0, 6.283);
    x.fill();
  }
  x.globalAlpha = 1;
}

// 연출이 겹쳐 돌면(판독 직후 celebs.json 도착, 성별 변경 등) 스캔 위에 결과가 덮여 깜빡인다.
let revealSeq = 0;
function reveal(withScan = true) {
  if (!ranked) return;
  const seq = ++revealSeq;
  const A = ranked[0].a, aimg = animImgs[A.id];
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SCAN = withScan && LM_DRAW && !calm ? 1100 : 0;
  const MESH = SCAN ? 500 : 0;                 // 찍힌 점을 선으로 이어 '메시를 떴다'는 느낌을 준다
  const D3 = SCAN && LM3 ? 1300 : 0;           // 찍은 점을 3D로 한 번 돌려 보여준다
  const SPIN = withScan && !calm ? 1300 : 0;   // → 후보를 한 바퀴 돌리고
  const FADE = calm ? 200 : (withScan ? 1000 : 700);   // → 정답이 천천히 떠오른다
  const reel = SPIN ? spinReel(A.id, 15) : [];
  const t0 = performance.now();
  const drawAnimal = (img, alpha, scale) => {
    if (!img || !img.complete) return;
    const W = cv.width, H = cv.height, w = W*scale, h = H*scale;
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, (W-w)/2, (H-h)/2, w, h);
    ctx.globalAlpha = 1;
  };
  (function step(){
    if (seq !== revealSeq || mirroring) return;
    const el = performance.now() - t0;
    if (el < SCAN) {
      const p = el / SCAN;
      const box = drawBase(1);
      if (box) {
        const n = Math.floor(SAMPLE.length * Math.min(1, p*1.15));
        ctx.fillStyle = '#3ba7a0';
        for (let i = 0; i < n; i++) {
          const q = toPx(LM_DRAW[SAMPLE[i]], box);
          ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1.2, cv.width*0.0042), 0, 6.283); ctx.fill();
        }
        // 스캔 라인
        const y = box.y + box.h * p;
        ctx.strokeStyle = 'rgba(242,104,60,.9)'; ctx.lineWidth = Math.max(2, cv.width*0.006);
        ctx.beginPath(); ctx.moveTo(box.x, y); ctx.lineTo(box.x+box.w, y); ctx.stroke();
      }
      return requestAnimationFrame(step);
    }
    if (el < SCAN + MESH) {
      // 메시 라인: 점을 i ↔ i+7로 이어 삼각망처럼 보이게 한다. 실제 위상이 아니라 연출이라
      // 정확한 tesselation 인덱스를 들고 다닐 필요는 없다. 선이 순차로 그어지며 차오른다.
      const p = (el - SCAN) / MESH;
      const box = drawBase(1);
      if (box) {
        const pts = SAMPLE.map(i => toPx(LM_DRAW[i], box));
        ctx.fillStyle = '#3ba7a0';
        for (const q of pts) { ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1.2, cv.width*0.0042), 0, 6.283); ctx.fill(); }
        ctx.strokeStyle = 'rgba(59,167,160,.42)';
        ctx.lineWidth = Math.max(1, cv.width*0.0022);
        ctx.beginPath();
        const n = Math.floor(pts.length * Math.min(1, p*1.2));
        for (let i = 0; i < n; i++) {
          const a = pts[i], b = pts[(i+7) % pts.length];
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        }
        ctx.stroke();   // 선 전체를 한 번에 stroke — 선마다 stroke하면 프레임이 뚝뚝 끊긴다
      }
      return requestAnimationFrame(step);
    }
    if (el < SCAN + MESH + D3) {
      const p = (el - SCAN - MESH) / D3;
      const box = drawBase(Math.max(0, 1 - p/0.3) * 0.45);   // 사진은 앞 30%에서 빠진다
      if (box) {
        // 방금 점을 찍은 '얼굴 위치'에서 무대 중앙으로 옮겨가며 돈다.
        // 곧장 중앙에서 시작하면 점이 순간이동해 연속감이 끊긴다.
        const f = faceBoxPx(box), t = Math.min(1, p/0.25), e = t*t*(3-2*t);
        const cx = f.cx + (box.x + box.w/2 - f.cx)*e;
        const cy = f.cy + (box.y + box.h*0.5 - f.cy)*e;
        const R  = f.r  + (box.h*0.36 - f.r)*e;
        const yaw = Math.sin(p * Math.PI * 2) * 0.73;        // ±42° 왕복 한 번
        drawCloud(ctx, FRONT3, cx, cy, R, yaw, cloudColor(), Math.max(2.2, cv.width*0.006));
      }
      return requestAnimationFrame(step);
    }
    if (el < SCAN + MESH + D3 + SPIN && reel.length) {
      const p = (el - SCAN - MESH - D3) / SPIN;
      const e = 1 - Math.pow(1 - p, 3);              // 빠르게 시작해 멈추듯 감속
      const i = Math.min(reel.length - 1, Math.floor(e * reel.length));
      drawBase(0.28);
      drawAnimal(animImgs[reel[i].id], 0.9, 0.86 + 0.06*e);
      return requestAnimationFrame(step);
    }
    const t = Math.min(1, (el - SCAN - MESH - D3 - SPIN) / FADE);
    const e = t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    // 룰렛을 돌린 뒤엔 이미 사진이 0.28까지 내려가 있다. 스캔 없이 부를 땐 사진에서 바로 넘어간다.
    drawBase((SPIN ? 0.28 : 1) * (1-e));
    drawAnimal(aimg, SPIN ? 0.9 + 0.1*e : e, SPIN ? 0.92 + 0.08*e : 1);
    if (t < 1) requestAnimationFrame(step);
  })();
}

function renderAxes() {
  $('axCard').style.display = '';
  $('axes').innerHTML = Object.keys(AX).map(k =>
    `<div class="k">${AF_I18N.axis(k)}</div><div class="v">${AX[k].toFixed(2)}</div>
     <div class="bar"><i style="width:${(AX[k]*100).toFixed(0)}%"></i></div>`).join('');
}

/* 연예인 라벨이 있는 유형은 23종 중 12종뿐이다. 1등에 라벨이 없다고 줄을 통째로 지우면
   "연예인 안 나오는 판독기"가 된다 → 라벨 있는 가장 가까운 순위로 내려가서 보여준다. */
function celebLine(winner) {
  const own = celebsOf(winner.id, SEX).length ? celebsOf(winner.id, SEX) : celebsOf(winner.id, '');
  if (own.length)
    return `<div class="celeb">${T('celebSame', { name: NAME(winner) })}<div class="cs">${celebChips(own, 6)}</div></div>`;
  const near = ranked.slice(1).find(s => celebsOf(s.a.id, SEX).length || celebsOf(s.a.id, '').length);
  if (!near) return '';
  const c = celebsOf(near.a.id, SEX).length ? celebsOf(near.a.id, SEX) : celebsOf(near.a.id, '');
  return `<div class="celeb">${T('celebNear',
    { name: NAME(winner), near: NAME(near.a), pct: near.pct })}<div class="cs">${celebChips(c, 5)}</div></div>`;
}


// 성별 추정을 화면에 드러내고, 틀렸으면 사용자가 바로 바꾸게 한다.
// 숨겨두면 "왜 여자 얼굴에 늑대상이 나왔지"를 설명할 방법이 없다.
function sexChipLabel() {
  const key = SEX_MODE === 'f' ? 'sexPickedF' : SEX_MODE === 'm' ? 'sexPickedM'
    : SEX_MODE === 'off' ? 'sexOff' : (PFEM >= 0.5 ? 'sexAutoF' : 'sexAutoM');
  return T(key, { pct: Math.round((PFEM >= 0.5 ? PFEM : 1-PFEM) * 100) });
}
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('#sexChip') || !AX) return;
  SEX_MODE = SEX_MODE === 'auto' ? (PFEM >= 0.5 ? 'm' : 'f') : SEX_MODE === 'f' ? 'm'
           : SEX_MODE === 'm' ? 'off' : 'auto';
  ranked = match(AX);
  renderResult(true);
});

/* ---- 동물상 분포(랭킹) ----
   점수 랭킹을 두지 않는 이유는 서버 라우트 주석에 적어뒀다 — 일치율은 전원 90%대라 순위가 안 갈린다.
   대신 "내 동물상이 전체에서 얼마나 희귀한가"를 보여준다. */
const RANK_API = 'https://relay.cocy.io/api/rankings/animalface';
let LAST_DIST = null;

async function submitDist(animalId) {
  try {
    await fetch(RANK_API, { method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ animal: animalId, sex: SEX }) });
  } catch (e) {}          // 집계 실패가 판독을 막으면 안 된다
  loadDist(animalId);
}

async function loadDist(mineId) {
  $('distCard').style.display = '';
  if (!LAST_DIST) $('dist').innerHTML = `<div class="c" style="grid-column:1/-1">${T('distLoading')}</div>`;
  try {
    const r = await fetch(RANK_API, { cache:'no-store' });
    const j = await r.json();
    if (!j.success) throw new Error(j.error || 'fail');
    LAST_DIST = { rows: j.rankings || [], total: j.total || 0, mine: mineId };
    renderDist(LAST_DIST);
    if (ranked) renderResult();       // 희귀도 도장은 분포가 와야 붙는다
  } catch (e) {
    $('dist').innerHTML = `<div class="c" style="grid-column:1/-1">${T('distFail')}</div>`;
  }
}

function renderDist(d) {
  const byId = Object.fromEntries(ANIMALS.map(a => [a.id, a]));
  const rows = d.rows.filter(r => byId[r.animal]);
  const max = Math.max(1, ...rows.map(r => r.count));
  const mineIdx = rows.findIndex(r => r.animal === d.mine);
  $('dist').innerHTML = rows.slice(0, 10).map((r, i) => {
    const a = byId[r.animal], me = r.animal === d.mine;
    return `<div class="rk">${i + 1}</div><img src="img/${a.id}.webp" alt=""><div class="${me ? 'me' : ''}">${NAME(a)}
      <div class="t"><i style="width:${(r.count/max*100).toFixed(0)}%"></i></div></div>
      <div class="c">${r.count}</div>`;
  }).join('');
  $('distTotal').textContent = T('distTotal', { total: d.total });
  if (mineIdx >= 0 && d.total) {
    const share = (rows[mineIdx].count * 100 / d.total).toFixed(1);
    // 희귀도는 '적게 나온 순' 등수 — 흔한 강아지상이 1위가 되면 말이 안 된다
    const rarer = rows.filter(r => r.count < rows[mineIdx].count).length;
    $('distMine').textContent = T('distMine',
      { name: NAME(byId[d.mine]), share, rank: rarer + 1, kinds: rows.length });
  } else $('distMine').textContent = '';
}

function renderResult(doReveal = false) {
  const b = ranked[0];
  $('resultCard').style.display = '';
  const C = 2 * Math.PI * 52;                       // r=52 원둘레 — 게이지 dash 계산용
  $('result').innerHTML =
    `<div class="win">
       <div class="gauge">
         <svg viewBox="0 0 118 118" aria-hidden="true">
           <circle class="trk" cx="59" cy="59" r="52"></circle>
           <circle class="val" cx="59" cy="59" r="52"
                   stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"></circle>
         </svg>
         <img src="img/${b.a.id}.webp" alt="${NAME(b.a)}">
       </div>
       <div>
         ${rarityBadge(b.a)}
         <div class="nm">${NAME(b.a)}</div>
         <div class="pc">${b.pct}%</div>
         <div class="ds">${DESC(b.a)}</div>
       </div>
     </div>
     <div class="why">${whyChips(AX, b.a)}</div>
     <button class="sexchip" id="sexChip">${sexChipLabel()}</button>
     ${celebLine(b.a)}
     <div class="runner">${ranked.slice(1,4).map(s =>
       `<div><img src="img/${s.a.id}.webp" alt=""><div class="n">${NAME(s.a)}</div><div class="p">${s.pct}%</div></div>`).join('')}
     </div>`;
  // dashoffset을 다음 프레임에 바꿔야 트랜지션이 돈다(같은 프레임에 넣으면 즉시 점프)
  const val = $('result').querySelector('.gauge .val');
  if (val) requestAnimationFrame(() => { val.style.strokeDashoffset = (C * (1 - b.pct/100)).toFixed(1); });
  // 스캔·룰렛은 첫 판독에서만. 성별을 바꿔 1등이 달라졌을 때만 그림을 조용히 갈아끼운다.
  if (doReveal && LM) reveal(false);
}

// 근거는 문장보다 칩이 읽기 쉽다 — 두 축을 각각 하나씩
function whyChips(ax, animal) {
  return whyText(ax, animal).split(' · ').map(x => `<span>${x}</span>`).join('');
}

/* 희귀도 도장 — 분포가 도착하기 전에는 안 붙인다(추정치를 진짜처럼 보여주지 않는다).
   신수(사신기)는 애초에 잘 안 나오게 눌러놨으니 여기서 '전설'이 뜬다. */
function rarityBadge(animal) {
  if (!LAST_DIST || !LAST_DIST.total) return '';
  const row = LAST_DIST.rows.find(r => r.animal === animal.id);
  const share = row ? row.count * 100 / LAST_DIST.total : 0;
  if (!share) return '';
  const [cls, key] = share < 2 ? ['legend', 'rarityLegend']
    : share < 5 ? ['rare', 'rarityRare']
    : share < 12 ? ['uncommon', 'rarityUncommon'] : ['common', 'rarityCommon'];
  return `<div class="badge ${cls}">${T('rarityOf',
    { label: T(key), share: share.toFixed(1) })}</div>`;
}


/* ---- 공유 ----
   결과를 이미지 한 장으로 만든다. 텍스트만 공유하면 무슨 얘긴지 안 보이고,
   화면 캡처를 시키면 UI가 통째로 들어가 지저분하다.
   카드는 전부 로컬 캔버스에서 만든다 — 사진이 서버로 가는 경로는 여전히 없다. */
const SHARE_URL = 'https://game.cocy.io/animalface/';

function roundImg(x, cx, cy, r, img, ring) {
  x.save();
  x.beginPath(); x.arc(cx, cy, r, 0, 6.283); x.closePath(); x.clip();
  x.fillStyle = '#efe8d9'; x.fill();
  if (img) {
    const s = Math.max(2*r / img.width, 2*r / img.height);
    const w = img.width*s, h = img.height*s;
    x.drawImage(img, cx - w/2, cy - h/2, w, h);
  }
  x.restore();
  x.beginPath(); x.arc(cx, cy, r, 0, 6.283);
  x.strokeStyle = ring; x.lineWidth = 6; x.stroke();
}

// 글자수로 자르면 영어·일본어가 단어 중간에서 끊긴다(실제로 "…hold a room w"로 나갔다)
function wrapText(x, text, cx, y, maxW, lh, maxLines) {
  const words = text.split(/(\s+)/);
  const lines = []; let cur = '';
  for (const w of words) {
    if (x.measureText(cur + w).width > maxW && cur) { lines.push(cur.trim()); cur = w.trim(); }
    else cur += w;
    if (lines.length === maxLines) break;
  }
  if (lines.length < maxLines && cur.trim()) lines.push(cur.trim());
  lines.slice(0, maxLines).forEach((l, i) => x.fillText(l, cx, y + i*lh));
}

async function shareCard() {
  const b = ranked[0], A = b.a;
  const S = 1080, c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#f7f2e7'; x.fillRect(0, 0, S, S);
  // 종이 결 — 화면과 같은 도트
  x.fillStyle = 'rgba(36,31,26,.045)';
  for (let i = 20; i < S; i += 34) for (let j = 20; j < S; j += 34) { x.fillRect(i, j, 3, 3); }
  x.fillStyle = '#241f1a';
  x.font = '900 40px -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif';
  x.textAlign = 'center';
  x.fillText(T('title'), S/2, 96);

  /* 얼굴 사진은 카드에 넣지 않는다 — 내 얼굴이 박힌 이미지를 SNS에 올릴 사람은 거의 없다.
     대신 판독에 실제로 쓴 468점을 3D로 살짝 틀어서 그린다. 이쪽이 공유도 쉽고 그림도 산다. */
  roundImg(x, 300, 380, 170, null, cloudColor());
  drawCloud(x, FRONT3, 300, 380, 150, 0.38, cloudColor(), 3.4);
  roundImg(x, 780, 380, 170, animImgs[A.id], '#e2532f');
  x.fillStyle = '#e2532f';
  x.font = '900 64px -apple-system, system-ui, sans-serif';
  x.fillText('=', S/2, 400);

  x.fillStyle = '#241f1a';
  x.font = '900 76px -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif';
  x.fillText(NAME(A), S/2, 660);
  x.fillStyle = '#e2532f';
  x.font = '900 56px -apple-system, system-ui, sans-serif';
  x.fillText(b.pct + '%', S/2, 730);

  // 희귀도는 분포가 있을 때만 — 없는 수치를 지어내지 않는다
  const badge = LAST_DIST && LAST_DIST.total
    ? (LAST_DIST.rows.find(r => r.animal === A.id)) : null;
  if (badge) {
    const share = badge.count * 100 / LAST_DIST.total;
    const key = share < 2 ? 'rarityLegend' : share < 5 ? 'rarityRare'
      : share < 12 ? 'rarityUncommon' : 'rarityCommon';
    const label = T('rarityOf', { label: T(key), share: share.toFixed(1) });
    x.font = '800 34px -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif';
    const w = x.measureText(label).width + 56;
    x.fillStyle = '#f3ecdd'; x.strokeStyle = '#ded2ba'; x.lineWidth = 3;
    const bx = S/2 - w/2, by = 772;
    x.beginPath(); x.roundRect(bx, by, w, 62, 31); x.fill(); x.stroke();
    x.fillStyle = '#6b6255';
    x.fillText(label, S/2, by + 42);
  }

  x.fillStyle = '#6b6255';
  x.font = '700 32px -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif';
  wrapText(x, DESC(A), S/2, 880, S - 160, 40, 2);
  x.fillStyle = '#6b6255';
  x.font = '700 26px -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif';
  x.fillText(T('shareNote'), S/2, 952);
  x.fillStyle = '#241f1a';
  x.font = '800 30px ui-monospace, monospace';
  x.fillText('game.cocy.io/animalface', S/2, 1010);
  return new Promise(res => c.toBlob(res, 'image/png'));
}

$('share').onclick = async () => {
  if (!ranked) return;
  const btn = $('share'), label = T('share');
  btn.disabled = true; btn.textContent = T('shareMaking');
  try {
    const blob = await shareCard();
    const name = NAME(ranked[0].a);
    const file = new File([blob], 'animalface.png', { type: 'image/png' });
    const text = T('shareText', { name, pct: ranked[0].pct });
    // 파일 공유가 되는 기기(대부분의 모바일)에서는 바로 공유 시트를 띄운다
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text, url: SHARE_URL });
      $('shareOut').innerHTML = '';
    } else {
      const url = URL.createObjectURL(blob);
      let copied = '';
      try { await navigator.clipboard.writeText(text + ' ' + SHARE_URL); copied = T('shareCopied'); } catch (e) {}
      $('shareOut').innerHTML =
        `<img src="${url}" alt="" style="width:100%;border-radius:14px;margin-top:10px">
         <a class="btn sec" style="display:flex;align-items:center;justify-content:center;
            text-decoration:none;margin-top:8px" href="${url}" download="animalface-${name}.png">${T('shareSave')}</a>
         ${copied ? `<div class="hint">${copied}</div>` : ''}`;
    }
  } catch (e) {
    if (e.name !== 'AbortError') $('shareOut').innerHTML = `<div class="hint err">${T('shareFail', { msg: e.message })}</div>`;
  }
  btn.disabled = false; btn.textContent = label;
};


/* 이미지 카드가 부담스럽거나(용량·계정) 텍스트만 보내고 싶은 경우가 있다 → 링크 공유를 따로 둔다.
   navigator.share는 파일 없이도 되고, 안 되면 클립보드로 떨어진다. */
$('shareLink').onclick = async () => {
  const text = ranked ? T('shareText', { name: NAME(ranked[0].a), pct: ranked[0].pct }) : T('title');
  try {
    if (navigator.share) { await navigator.share({ text, url: SHARE_URL }); return; }
    await navigator.clipboard.writeText(text + ' ' + SHARE_URL);
    $('shareOut').innerHTML = `<div class="hint">${T('shareCopied')}</div>`;
  } catch (e) {
    if (e.name === 'AbortError') return;
    // 클립보드가 막힌 브라우저를 위해 눈으로 복사할 수 있게 텍스트로 노출한다
    $('shareOut').innerHTML =
      `<div class="hint">${text} ${SHARE_URL}</div>`;
  }
};

/* ---- WebGL 워프 ----
   캔버스 2D로 조각을 덧그리면 원본 눈·입이 밑에 남는다(겹침). 여기서는 출력 픽셀마다
   원본의 어느 지점을 읽을지만 옮긴다 → 복제가 원리상 없고 경계도 안 생긴다. */
const GLW = (() => { try {
  const cvs = $('gl');
  const gl = cvs.getContext('webgl', { premultipliedAlpha:false, antialias:true });
  if (!gl) return null;
  const VS = `attribute vec2 p; varying vec2 vUv;
    void main(){ vUv = vec2(p.x*0.5+0.5, 0.5-p.y*0.5); gl_Position = vec4(p,0.0,1.0); }`;
  const FS = `precision highp float;
    varying vec2 vUv; uniform sampler2D tex;
    uniform vec4 eyeL, eyeR, mouth;
    uniform float blink, jaw, smile, brow;
    float fall(vec2 uv, vec4 b){ return 1.0 - smoothstep(0.55, 1.0, length((uv - b.xy) / b.zw)); }
    vec2 eyeWarp(vec2 uv, vec4 b){
      float w = fall(uv, b); if (w <= 0.0) return vec2(0.0);
      // 변위가 falloff 반경(b.w)을 넘으면 영향권 밖(이마·귀)을 끌어온다 → 반드시 묶는다
      float dy = -(blink * 0.85 + brow * 0.25) * b.w;
      return vec2(0.0, clamp(dy, -b.w, b.w)) * w;
    }
    vec2 mouthWarp(vec2 uv, vec4 b){
      float w = fall(uv, b); if (w <= 0.0) return vec2(0.0);
      float top = b.y - b.w * 0.55;
      vec2 off = vec2(0.0);
      if (uv.y > top) off.y = (top + (uv.y - top) / (1.0 + jaw * 1.50)) - uv.y;
      off.x = (b.x + (uv.x - b.x) / (1.0 + smile * 0.45)) - uv.x;
      off.y += smile * b.w * 0.35 * smoothstep(0.2, 1.0, abs(uv.x - b.x) / b.z);
      return off * w;
    }
    void main(){
      vec2 uv = vUv + eyeWarp(vUv, eyeL) + eyeWarp(vUv, eyeR) + mouthWarp(vUv, mouth);
      gl_FragColor = texture2D(tex, clamp(uv, 0.0, 1.0));
    }`;
  const sh = (t,s) => { const o = gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const u = { eyeL:U('eyeL'), eyeR:U('eyeR'), mouth:U('mouth'),
              blink:U('blink'), jaw:U('jaw'), smile:U('smile'), brow:U('brow') };
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  let texId = null;
  // 박스[x,y,w,h] → 중심 + '반경'. w/h를 그대로 반경으로 쓰면 영향권이 2배가 된다.
  const box = b => [b[0]+b[2]/2, b[1]+b[3]/2, b[2]/2*1.15, b[3]/2*1.6];
  return {
    setImage(img, id) {
      if (texId === id) return;
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      texId = id;
    },
    render(W, H, boxes, s) {
      if (cvs.width !== W || cvs.height !== H) { cvs.width = W; cvs.height = H; }
      gl.viewport(0, 0, W, H);
      gl.uniform4fv(u.eyeL, box(boxes.eyeL));
      gl.uniform4fv(u.eyeR, box(boxes.eyeR));
      gl.uniform4fv(u.mouth, box(boxes.mouth));
      gl.uniform1f(u.blink, s.blink); gl.uniform1f(u.jaw, s.jaw);
      gl.uniform1f(u.smile, s.smile); gl.uniform1f(u.brow, s.brow);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      return cvs;
    }
  };
} catch (e) { console.warn('WebGL warp 불가:', e); return null; } })();

/* 워프 튜닝/검증용: ?warp=blink,jaw,smile,brow&animal=fox 로 카메라 없이 고정값 렌더 */
(function debugWarp(){
  const q = new URLSearchParams(location.search);
  if (!q.get('warp') || !GLW) return;
  const [blink=0, jaw=0, smile=0, brow=0] = q.get('warp').split(',').map(Number);
  const wanted = q.get('animal');
  const iv = setInterval(() => {
    if (!ANIMALS.length) return;
    const A = ANIMALS.find(a => a.id === wanted) || ANIMALS[0];
    const img = animImgs[A.id];
    if (!img.complete) return;
    clearInterval(iv);
    GLW.setImage(img, A.id);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(GLW.render(cv.width, cv.height, A.boxes, { blink, jaw, smile, brow }), 0, 0);
    $('ph').style.display = 'none';
    document.body.dataset.warpReady = A.id;
  }, 60);
})();

// ---- 표정 미러링 ----
let mirroring = false, camStream = null;
function stopMirror(){
  mirroring = false;
  $('mirror').textContent = T('mirror');
  $('rec').style.display = 'none';
  if ($('shotRow').style.display === 'none') $('vid').style.display = 'none';
}

$('mirror').onclick = async () => {
  if (mirroring) { stopMirror(); if (ranked) redraw(); return; }
  if (!ranked) return;
  const v = $('vid');
  if (!v.srcObject) {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:640 } });
      v.srcObject = camStream; await v.play();
    } catch (e) {
      $('gifOut').innerHTML = `<div class="hint err">${T('errCam', { msg: e.message })}</div>`;
      return;
    }
  }
  // 숨긴 video는 브라우저가 프레임 갱신을 늦출 수 있다 → 보이게 두고 캔버스로 덮는다
  v.style.display = ''; $('shotRow').style.display = 'none';
  mirroring = true;
  $('mirror').textContent = T('mirrorStop');
  $('rec').disabled = false; $('rec').style.display = '';
  if (runMode !== 'VIDEO') { landmarker.setOptions({ runningMode:'VIDEO' }); runMode = 'VIDEO'; }
  const A = ranked[0].a, aimg = animImgs[A.id], bx = A.boxes;
  let last = -1;
  (function frame(){
    if (!mirroring) return;
    if (v.currentTime !== last) {
      last = v.currentTime;
      const cats = landmarker.detectForVideo(v, performance.now())?.faceBlendshapes?.[0]?.categories;
      if (cats) {
        const get = n => (cats.find(c => c.categoryName === n)?.score) || 0;
        const s = {
          blink: Math.max(get('eyeBlinkLeft'), get('eyeBlinkRight')),
          jaw:   get('jawOpen'),
          smile: Math.max(get('mouthSmileLeft'), get('mouthSmileRight')),
          brow:  Math.max(get('browOuterUpLeft'), get('browOuterUpRight')),
        };
        const W = cv.width, H = cv.height;
        ctx.clearRect(0,0,W,H);
        if (GLW && aimg.complete) {
          GLW.setImage(aimg, A.id);
          ctx.drawImage(GLW.render(W, H, bx, s), 0, 0);
        } else if (aimg.complete) {
          ctx.drawImage(aimg, 0, 0, W, H);   // WebGL 없는 기기: 정지 이미지로만
        }
      }
    }
    requestAnimationFrame(frame);
  })();
};

// ---- GIF (gif.js, MIT) ----
$('rec').onclick = async () => {
  if (!mirroring) { $('gifOut').innerHTML = `<div class="hint">${T('gifNeedMirror')}</div>`; return; }
  const btn = $('rec'); btn.disabled = true;
  const SIZE = 320, FPS = 9, SEC = 3;   // 360·10fps는 1.2MB라 공유용으로 무겁다
  try {
    // gif.js(MIT)를 자체 호스팅한다. Worker는 동일 출처여야 해서
    // CDN 경로를 workerScript로 주면 브라우저가 차단한다("cannot be accessed from origin").
    if (!window.GIF) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'lib/gif.js?v=1';
        s.onload = res; s.onerror = () => rej(new Error('GIF 라이브러리 로드 실패'));
        document.head.appendChild(s);
      });
    }
    const gif = new window.GIF({ workers:2, quality:15, width:SIZE, height:SIZE,
      workerScript:'lib/gif.worker.js?v=1' });
    const tmp = document.createElement('canvas'); tmp.width = tmp.height = SIZE;
    const tctx = tmp.getContext('2d');
    const total = FPS*SEC;
    for (let i = 0; i < total; i++) {
      btn.textContent = T('gifRec', { i: i+1, n: total });
      tctx.drawImage(cv, 0, 0, SIZE, SIZE);
      gif.addFrame(tctx, { copy:true, delay:1000/FPS });
      await new Promise(r => setTimeout(r, 1000/FPS));
    }
    btn.textContent = T('gifMaking');
    const blob = await new Promise(res => { gif.on('finished', res); gif.render(); });
    const url = URL.createObjectURL(blob);
    const name = ranked ? NAME(ranked[0].a) : 'animalface';
    $('gifOut').innerHTML =
      `<div class="hint">${T('gifHint', { kb: (blob.size/1024).toFixed(0) })}</div>
       <img src="${url}" style="width:100%;border-radius:12px;margin-top:6px">
       <a class="btn sec" style="display:block;text-align:center;text-decoration:none;margin-top:8px"
          href="${url}" download="${name}.gif">${T('gifSave')}</a>`;
  } catch (e) {
    $('gifOut').innerHTML = `<div class="hint err">${T('gifFail', { msg: e.message })}</div>`;
  }
  btn.textContent = T('gif'); btn.disabled = false;
};

// 정적 마크업 치환은 마지막에 한 번 — 위에서 정의한 것들이 다 준비된 뒤여야 한다.
applyLang();
